name: Java CI

on:
  push:
    paths:
      - "src/main/java/**"
      - "src/main/resources/**"
      - "src/test/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "config/checkstyle/**"
      - ".github/workflows/java-ci.yml"
  pull_request:
    paths:
      - "src/main/java/**"
      - "src/main/resources/**"
      - "src/test/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "config/checkstyle/**"
      - ".github/workflows/java-ci.yml"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - run: chmod +x gradlew
      - name: Lint and test
        env:
          GRADLE_OPTS: -Dorg.gradle.internal.test.binary.results-store=false
        run: ./gradlew checkstyleMain checkstyleTest test --no-daemon
