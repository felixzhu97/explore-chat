openapi: 3.0.3
info:
  title: ExploreChat AIP REST contract (fragment)
  version: 1.0.0
  description: >
    Minimal OpenAPI fragment for Spectral checks of AIP list/error
    conventions. Full runtime docs are generated by Nest Swagger.
servers:
  - url: /api/v1
paths:
  /users:
    get:
      operationId: listUsers
      parameters:
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: page_token
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      type: object
                  next_page_token:
                    type: string
        "400":
          description: Invalid argument
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcStatus"
  /chats/{chat}/messages:
    get:
      operationId: listMessages
      parameters:
        - name: chat
          in: path
          required: true
          schema:
            type: string
        - name: page_size
          in: query
          schema:
            type: integer
        - name: page_token
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                  next_page_token:
                    type: string
components:
  schemas:
    RpcStatus:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_ARGUMENT
            - NOT_FOUND
            - PERMISSION_DENIED
            - UNAUTHENTICATED
            - INTERNAL
            - ALREADY_EXISTS
            - UNAVAILABLE
            - UNIMPLEMENTED
        message:
          type: string
        details:
          type: array
          items:
            type: object
