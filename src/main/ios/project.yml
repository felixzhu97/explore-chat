name: Chat
options:
  bundleIdPrefix: com.chat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.1
targets:
  Chat:
    type: application
    platform: iOS
    sources:
      - path: Chat
        excludes:
          - Resources
      - path: Chat/Resources
        buildPhase: resources
    info:
      path: Chat/Info.plist
      properties:
        CFBundleDisplayName: Chat
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Chat needs the camera for calls and posts.
        NSMicrophoneUsageDescription: Chat needs the microphone for calls.
        NSPhotoLibraryUsageDescription: Chat needs photos for posts and avatars.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIAppFonts:
          - GrandHotel-Regular.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chat.chat
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: SocketIO
        product: SocketIO
  ChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ChatTests
    dependencies:
      - target: Chat
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.chat.chat.tests
