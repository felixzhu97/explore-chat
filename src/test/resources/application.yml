chat:
  socketio:
    enabled: false
  demo-seed: false
  kafka:
    brokers: []

spring:
  datasource:
    url: jdbc:h2:mem:explore-chat-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
